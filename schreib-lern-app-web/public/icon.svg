<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4361ee"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="pencil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Hintergrund -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Papier -->
  <rect x="96" y="112" width="320" height="288" rx="28" fill="#fafafa"/>

  <!-- Linienblatt: Oberlinie, Mittellinie, Grundlinie -->
  <line x1="132" y1="176" x2="380" y2="176" stroke="#93c5fd" stroke-width="5" stroke-dasharray="12 9" stroke-linecap="round"/>
  <line x1="132" y1="256" x2="380" y2="256" stroke="#93c5fd" stroke-width="5" stroke-dasharray="12 9" stroke-linecap="round"/>
  <line x1="132" y1="336" x2="380" y2="336" stroke="#fca5a5" stroke-width="6" stroke-linecap="round"/>

  <!-- Großes A auf der Linie -->
  <path d="M 192 336 L 244 176 L 296 336" fill="none" stroke="#4361ee" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="212" y1="276" x2="276" y2="276" stroke="#4361ee" stroke-width="26" stroke-linecap="round"/>

  <!-- Startpunkt -->
  <circle cx="244" cy="176" r="21" fill="url(#pencil)"/>
  <circle cx="244" cy="176" r="9" fill="#fff"/>

  <!-- Stift -->
  <g transform="rotate(38 352 300)">
    <rect x="336" y="228" width="34" height="132" rx="9" fill="url(#pencil)"/>
    <rect x="336" y="228" width="34" height="26" rx="9" fill="#f472b6"/>
    <path d="M 336 360 L 353 400 L 370 360 Z" fill="#fde68a"/>
    <path d="M 347 384 L 353 400 L 359 384 Z" fill="#374151"/>
  </g>
</svg>
