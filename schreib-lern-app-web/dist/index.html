<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#312e81" />
    <meta name="description" content="Schreiben lernen — Buchstaben und Zahlen spielerisch üben" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Schreiben" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Schreiben lernen</title>
    <style>
      /* Verhindert alles, was bei Kindern versehentlich ausgelöst wird:
         Textauswahl, Doppeltipp-Zoom, Pull-to-Refresh, Kontextmenü,
         Überscroll-Effekt und blaues Tap-Highlight. */
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overscroll-behavior: none;
        touch-action: manipulation;
        background: #312e81;
        font-family: Arial, Helvetica, sans-serif;
        /* Sichere Bereiche bei Geräten mit Notch */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
      #root {
        min-height: 100%;
      }
      /* Eingabefelder im Elternbereich müssen auswählbar bleiben */
      input,
      textarea,
      select {
        -webkit-user-select: text;
        user-select: text;
      }
      /* Canvas darf niemals gescrollt oder gezoomt werden */
      canvas {
        touch-action: none;
      }
    </style>
